{% extends "base.html" %}
{% block title %}{{ titulo }}{% endblock %}
{% block content %}
<h1 class="h3 mb-3">{{ titulo }}</h1>
<div class="card"><div class="card-body">
  <form method="post" novalidate>
    <div class="mb-3">
      <label class="form-label" for="nombre_plan">Nombre del plan *</label>
      <input class="form-control" id="nombre_plan" name="nombre_plan"
             value="{{ item.nombre_plan or '' }}">
    </div>
    <div class="mb-3">
      <label class="form-label" for="duracion_dias">Duración (días) *</label>
      <input type="number" class="form-control" id="duracion_dias" name="duracion_dias"
             value="{{ item.duracion_dias or '' }}">
    </div>
    <div class="mb-3">
      <label class="form-label" for="precio">Precio *</label>
      <input type="number" step="0.01" class="form-control" id="precio" name="precio"
             value="{{ item.precio or '' }}">
    </div>
    <div class="mb-3">
      <label class="form-label" for="descripcion">Descripción</label>
      <input class="form-control" id="descripcion" name="descripcion"
             value="{{ item.descripcion or '' }}">
    </div>
    <button class="btn btn-primary">Guardar</button>
    <a class="btn btn-secondary" href="{{ url_for('planes.listar') }}">Cancelar</a>
  </form>
</div></div>
{% endblock %}
