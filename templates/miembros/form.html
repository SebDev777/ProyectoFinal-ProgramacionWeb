{% extends "base.html" %}
{% block title %}{{ titulo }}{% endblock %}
{% block content %}
<div class="row justify-content-center">
  <div class="col-lg-8 col-xl-7">
    <div class="mb-4">
      <h1 class="ip-title">{{ titulo }}</h1>
    </div>

    <div class="ip-card">
      <form method="post" class="p-4">
        <div class="row g-3">
          <div class="col-12">
            <label class="form-label" for="nombre_miembro">Nombre completo *</label>
            <input class="form-control" id="nombre_miembro" name="nombre_miembro"
                   maxlength="100" required autofocus
                   value="{{ item.nombre_miembro or '' }}">
          </div>

          <div class="col-md-6">
            <label class="form-label" for="documento">Documento *</label>
            <input class="form-control" id="documento" name="documento"
                   maxlength="15" required inputmode="numeric"
                   value="{{ item.documento or '' }}">
          </div>

          <div class="col-md-6">
            <label class="form-label" for="fecha_nacimiento">Fecha de nacimiento *</label>
            <input type="date" class="form-control" id="fecha_nacimiento" name="fecha_nacimiento"
                   required value="{{ item.fecha_nacimiento or '' }}">
          </div>

          <div class="col-md-6">
            <label class="form-label" for="email">Correo</label>
            <input type="email" class="form-control" id="email" name="email"
                   maxlength="120" value="{{ item.email or '' }}">
          </div>

          <div class="col-md-6">
            <label class="form-label" for="telefono">Teléfono</label>
            <input class="form-control" id="telefono" name="telefono"
                   maxlength="15" value="{{ item.telefono or '' }}">
          </div>

          <div class="col-md-6">
            <label class="form-label" for="id_plan">Plan *</label>
            <select class="form-select" id="id_plan" name="id_plan" required>
              <option value="">Selecciona un plan...</option>
              {% for pl in planes %}
                <option value="{{ pl.id_plan }}"
                        {{ 'selected' if item.id_plan|string == pl.id_plan|string }}>
                  {{ pl.nombre_plan }}
                </option>
              {% endfor %}
            </select>
          </div>

          <div class="col-md-6">
            <label class="form-label" for="fecha_inicio_plan">Inicio del plan *</label>
            <input type="date" class="form-control" id="fecha_inicio_plan" name="fecha_inicio_plan"
                   required value="{{ item.fecha_inicio_plan or '' }}">
          </div>
        </div>

        <div class="d-flex gap-2 mt-4">
          <button class="btn btn-primary" type="submit">
            <i class="bi bi-check-lg me-1"></i>Guardar miembro
          </button>
          <a class="btn btn-secondary" href="{{ url_for('miembros.listar') }}">Cancelar</a>
        </div>
      </form>
    </div>
  </div>
</div>
{% endblock %}
