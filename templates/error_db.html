{% extends "base.html" %}
{% block title %}Error de conexión{% endblock %}
{% block content %}
<div class="ip-error">
  <div class="code"><i class="bi bi-database-x"></i></div>
  <h1 class="h3 mb-2">No se pudo conectar a la base de datos</h1>
  <p class="text-secondary mb-4">
    Revisa que PostgreSQL esté encendido y que los datos de tu archivo <code>.env</code> sean correctos.
  </p>
  <button type="button" class="btn btn-primary" onclick="location.reload()">
    <i class="bi bi-arrow-clockwise me-1"></i>Reintentar
  </button>
</div>
{% endblock %}
